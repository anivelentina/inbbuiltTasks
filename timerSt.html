<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            background-color: crimson;
            color: whitesmoke;
            height: 100vh;
            padding: 100px;
            font-size: 100px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        
    </style>
</head>
<body>
    <h1 id="first"></h1>
    <script>
        function show() {
            
        let timer = document.getElementById("first")
        let clock = new Date()
        let hour = clock.getHours()
        let min = clock.getMinutes()
        let sec = clock.getSeconds()

        timer.innerText = hour + ":" + min + ":" + sec;
        }
        setInterval(show,1000);
    </script>
</body>
</html>
